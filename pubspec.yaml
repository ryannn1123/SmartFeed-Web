name: SmartFeed
description: SmartFeed - ESP32 Servo Controller

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.3.4
  http: ^1.6.0
  cupertino_icons: ^1.0.6
  geolocator: ^11.0.0
  url_launcher: ^6.2.6
  font_awesome_flutter: ^10.7.0
  flutter_dotenv: ^5.2.1
  intl: ^0.20.3
  mjpeg_view: ^1.0.1
  image_picker: ^1.2.3
  google_fonts: ^8.2.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  geocoding: ^3.0.0
  flutter_blue_plus: ^1.35.5
  permission_handler: ^11.3.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/smartfeed_logo.png
    - .env
        
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/smartfeed_logo1.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/smartfeed_logo1.png"